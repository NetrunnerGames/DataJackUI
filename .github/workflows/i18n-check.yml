name: i18n check

# Validates the localization RESX files on every PR/push that touches them:
# same key set as English, valid XML, consistent {0}/{1} placeholders.
# This guards against community translation PRs that drop keys or break interpolation.
on:
  pull_request:
    paths:
      - 'src/DataJackUIGui/Resources/Strings*.resx'
      - 'scripts/check-i18n.py'
  push:
    branches: [master, main]
    paths:
      - 'src/DataJackUIGui/Resources/Strings*.resx'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.x'

      - name: Validate translations
        run: python scripts/check-i18n.py
