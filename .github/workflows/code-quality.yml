name: Code Quality (Roslyn & Formatting)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format-and-build:
    name: Roslyn, dotnet format & XamlStyler
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'

      - name: Install XamlStyler CLI
        run: dotnet tool install -g XamlStyler.Console

      - name: Verify XAML Formatting (XamlStyler)
        run: xstyler -d src/DataJackUIGui -r -p

      - name: Verify C# Formatting (dotnet format)
        run: dotnet format whitespace src/DataJackUIGui/DataJackUIGui.csproj --verify-no-changes

      - name: Build with Roslyn Analyzers
        run: dotnet build src/DataJackUIGui/DataJackUIGui.csproj -c Release

      - name: Clean Build Output Artifacts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Include "bin", "obj" -Directory | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
